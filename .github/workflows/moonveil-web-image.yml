name: Moonveil Cloud Web Image

# Builds the SSR web console image OFF the dev box, and ships it back as a
# plain Actions artifact (tar.gz) rather than a registry image.
#
# Why this shape (2026-09-30):
#  - `next build` OOM-killed a 7.7G box on 2026-09-16, and the HK dev box has
#    only 3.9G / ~1.4G free, so the build cannot run there.
#  - GHCR turned out to be a dead end for this host: the package is private and
#    the registry endpoint 404s for the token we hold, while the GitHub REST
#    API is fast and reachable. An artifact is fetched over the same API.
#  - npm registries on this box take ~12s per request, so 811 deps would spend
#    ~2.7h in `yarn fetch` even with a memory cage. CI has the network headroom.
#
# Runtime four-service stack is unchanged — nothing is cut.

on:
  workflow_dispatch:
  push:
    branches: [moonveil]
    paths:
      - web-next/**
      - deploy/Dockerfile.web
      - .github/workflows/moonveil-web-image.yml

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image (load into local daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          load: true
          tags: moonveil-cloud-web:latest
          build-args: |
            YARN_REGISTRY=https://registry.npmmirror.com
            AGENTS_ANYWHERE_BROWSER_API=
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export as tar.gz artifact
        run: |
          set -euo pipefail
          mkdir -p out
          docker save moonveil-cloud-web:latest | gzip -1 > out/moonveil-cloud-web.tar.gz
          ls -lh out/
          # The image is ~1GB raw; a single artifact blob is capped, so verify
          # the size is under the limit rather than failing at upload time.
          sz=$(stat -c %s out/moonveil-cloud-web.tar.gz)
          echo "artifact bytes: $sz"
          if [ "$sz" -gt 2000000000 ]; then
            echo "artifact too large for a single upload; split needed" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonveil-cloud-web
          path: out/moonveil-cloud-web.tar.gz
          retention-days: 14
          compression-level: 0
