# Moonveil cloud v0 — derived from upstream docker/docker-compose.local.yml.
# Differences: own network, AA server on host port 8811 (8765/8766 taken by
# webdav/bridge on this box), PG/redis on loopback (no host port clash).
name: moonveil-cloud
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moonveil
      POSTGRES_USER: moonveil
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - moonveil-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moonveil -d moonveil"]
      interval: 2s; timeout: 5s; retries: 30
  redis:
    image: redis:8-alpine
    command: [redis-server, --save, "", --appendonly, "yes", --appendfsync, everysec, --maxmemory-policy, noeviction]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - moonveil-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s; timeout: 5s; retries: 30
  server:
    build:
      context: ./server
    environment:
      DATABASE_URL: "postgresql://moonveil:${POSTGRES_PASSWORD}@postgres:5432/moonveil"
      REDIS_URL: "redis://redis:6379/0"
      AGENT_SERVER_SECRET: "${AGENT_SERVER_SECRET}"
      REGISTRATION_OPEN: "false"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "0.0.0.0:8811:8765"
volumes:
  moonveil-pg:
  moonveil-redis:
