[project]
name = "agent-server"
version = "2.1.1"
description = "FastAPI backend for Agents Anywhere"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "claude-agent-sdk",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "httpx-s3-client",
    "jsonschema>=4.26.0",
    "loguru>=0.7.3",
    "python-multipart>=0.0.20",
    "redis>=6.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.47.0",
    "websockets>=16.0",
    "wsproto>=1.3.2",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.30.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
# Retired subtrees kept for reference; not maintained, not linted.
extend-exclude = [
    "_deprecated",
    "_reference",
    "agent-server-probe.files",
    "agent-server-moonveil.files",
]

[tool.ruff.lint]
# Ratchet baseline, not the full pycodestyle set: these are the rules the tree
# already satisfies, so the gate starts green and can only get stricter. Widen
# `select` when a family's existing violations have been cleared.
select = ["E4", "E7", "E9", "F", "W", "PIE", "RSE", "DTZ"]
# The `infra/repositories/*` facades deliberately re-export their module's
# surface with `import *`; F403/F405 flag every re-exported name as "undefined
# local". The pattern is intentional, so the two star-import rules are off.
ignore = ["F403", "F405"]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts set sys.path (and env) before importing agent_server, so
# their imports are necessarily below module level.
"scripts/*.py" = ["E402"]

[tool.uv.sources]
httpx-s3-client = { git = "https://github.com/t4wefan/httpx-s3-client.git" }
