[project]
name = "anywhere-cli"
version = "2.1.0"
description = "Local runtime connector for Agents Anywhere"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncer>=0.0.18",
    "claude-agent-sdk",
    "httpx[socks]>=0.28.1",
    "jsonschema>=4.26.0",
    "loguru>=0.7.3",
    "openai-codex>=0.144.4",
    "openai-codex-cli-bin>=0.144.4",
    "pexpect>=4.9.0; sys_platform != 'win32'",
    "psutil>=7.2.2",
    "ptyprocess>=0.7.0; sys_platform != 'win32'",
    "pydantic>=2.0.0",
    "pyte>=0.8.2",
    "python-socks>=2.8.1",
    "pywinpty>=2.0.13; sys_platform == 'win32'",
    "websockets>=16.0",
]

[project.scripts]
anywhere-cli = "connector.cli:main"
agent-connector = "connector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
# Retired subtrees kept for reference; not maintained, not linted.
extend-exclude = [
    "_deprecated",
    "_reference",
]

[tool.ruff.lint]
# Ratchet baseline, not the full pycodestyle set: these are the rules the tree
# already satisfies, so the gate starts green and can only get stricter. Widen
# `select` when a family's existing violations have been cleared.
select = ["E4", "E7", "E9", "F", "W", "PIE", "RSE", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# Tests that build the real server/connector on sys.path put those imports
# below module level on purpose.
"tests/test_claude_stale_frame_turn.py" = ["E402"]
"tests/test_tool_row_order_intra_message_e2e.py" = ["E402"]

[tool.hatch.build.targets.wheel]
packages = ["connector"]

[tool.uv]
package = true
