# Moonveil cloud v0 — full AA feature surface, nothing cut:
#   postgres + redis + server(API, python) + web(Next SSR console).
# web runs in SSR (NEXT_OUTPUT unset) so dynamic /share/[[...shareId]] works.
name: moonveil-cloud
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moonveil
      POSTGRES_USER: moonveil
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - moonveil-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moonveil -d moonveil"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:8-alpine
    command: [redis-server, --save, "", --appendonly, "yes", --appendfsync, everysec, --maxmemory-policy, noeviction]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - moonveil-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
      args:
        UV_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    environment:
      AGENT_SERVER_DB_URL: "postgresql+asyncpg://moonveil:${POSTGRES_PASSWORD}@postgres:5432/moonveil"
      REDIS_URL: "redis://redis:6379/0"
      AGENT_SERVER_SECRET: "${AGENT_SERVER_SECRET}"
      REGISTRATION_OPEN: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "0.0.0.0:8811:8000"
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        YARN_REGISTRY: https://registry.npmmirror.com
    environment:
      AGENTS_ANYWHERE_API: "${MOONVEIL_PUBLIC_API:-http://127.0.0.1:8811}"
    depends_on:
      - server
    ports:
      - "0.0.0.0:8812:5174"
volumes:
  moonveil-pg:
  moonveil-redis:
