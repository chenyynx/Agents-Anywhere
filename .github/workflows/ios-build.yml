name: iOS Build & Test

# Build & test pipeline for the `dev` development line. It mirrors the
# downstream `ios-ci` flow —
# unsigned .ipa for on-device KSign re-signing, no Apple Developer account —
# and adds the unit-test job (`swift test`).
#
# The `ios-ci` branch stays the clean upstream mirror; nothing here touches it.
# Artifacts are released to the dedicated `ipa-dev` tag so the
# mainline `ipa-latest` release is never overwritten.
#
# The deployment-target patch (26.5 -> 26.2, sideload compatibility) is
# carried on this branch itself (cherry-pick of the ios-ci patch commit).

on:
  push:
    branches: [dev]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:
    inputs:
      xcode:
        description: "Xcode app name on the runner (e.g. Xcode_26.5.app)"
        default: "Xcode_26.5.app"
      build:
        description: "Also build the unsigned IPA for this branch"
        type: boolean
        default: false
      timeline_autorun:
        description: "Run the 6b collection-timeline simulator gate"
        type: boolean
        default: false
      textkit_spike:
        description: "Run the C5/M1 TextKit 2 measurement spike"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pin Xcode
        run: |
          sudo xcode-select -s /Applications/${{ github.event.inputs.xcode || 'Xcode_26.5.app' }}
          xcodebuild -version

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-test-${{ runner.os }}-${{ hashFiles('ios/**/Package.resolved', 'ios/**/Package.swift') }}

      - name: Run unit tests
        run: |
          set -o pipefail
          swift test --package-path ios 2>&1 | tee "$RUNNER_TEMP/test.log" | tail -200

      - name: Print test failures on failure
        if: failure()
        run: |
          grep -n -B 2 -A 8 "error:" "$RUNNER_TEMP/test.log" 2>/dev/null | head -160 || true
          grep -n "recorded an issue" "$RUNNER_TEMP/test.log" 2>/dev/null | head -60 || true

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: ${{ runner.temp }}/test.log
          if-no-files-found: ignore

  timeline-autorun:
    # C3 gate: drive the real collection controller in a simulator and assert
    # measurement/offset/state-machine behaviour from the JSON it writes.
    needs: test
    if: inputs.timeline_autorun == true
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pin Xcode
        run: |
          sudo xcode-select -s /Applications/${{ github.event.inputs.xcode || 'Xcode_26.5.app' }}
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          best = None
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              version = (int(match.group(1)), int(match.group(2))) if match else (0, 0)
              for device in devices:
                  if not device.get("name", "").startswith("iPhone"):
                      continue
                  if not device.get("isAvailable", False):
                      continue
                  key = (version, device["name"])
                  if best is None or key > best[0]:
                      best = (key, device)
          if best is None:
              raise SystemExit("no available iPhone simulator runtime")
          print(f"udid={best[1]['udid']}")
          print(f"name={best[1]['name']}")
          print(f"runtime={best[0][0]}.{best[0][1]}")
          PY

      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: Build for simulator
        run: |
          set -o pipefail
          cd "ios/Agents Anywhere"
          xcodebuild build \
            -project "Agents Anywhere.xcodeproj" \
            -scheme "Agents Anywhere" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_DEBUG_DYLIB=NO \
            -derivedDataPath build/DDSim \
            2>&1 | tee "$RUNNER_TEMP/sim-build.log" | tail -40

      - name: Install and run the gate
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP="ios/Agents Anywhere/build/DDSim/Build/Products/Debug-iphonesimulator/Agents Anywhere.app"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl terminate "$UDID" com.agentsanywhere.app || true
          xcrun simctl launch "$UDID" com.agentsanywhere.app aa-timeline-autorun
          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.agentsanywhere.app data)
          RESULT="$CONTAINER/Documents/timeline-autorun.json"
          for _ in $(seq 1 180); do
            if [ -f "$RESULT" ]; then break; fi
            sleep 1
          done
          if [ ! -f "$RESULT" ]; then
            echo "::error::timeline auto-run produced no result file"
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/timeline-failure.png" || true
            exit 1
          fi
          cp "$RESULT" "$RUNNER_TEMP/timeline-autorun.json"
          cat "$RUNNER_TEMP/timeline-autorun.json"
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/timeline-final.png" || true

      - name: Assert gate results
        run: |
          python3 - <<'PY'
          import json, os, sys
          path = os.path.join(os.environ["RUNNER_TEMP"], "timeline-autorun.json")
          r = json.load(open(path))
          failures = r.get("failures", [])
          checks = []

          def check(name, condition, detail=""):
              checks.append((name, bool(condition), detail))

          m = r.get("measurement", {})
          samples = m.get("samples", [])
          text_kinds = {"message", "reasoning", "plain", "code", "table"}
          text_errors = [s.get("error", 0) for s in samples
                         if s.get("kind") in text_kinds]
          complex_errors = [s.get("error", 0) for s in samples
                            if s.get("kind") not in text_kinds]
          check("completed", r.get("completed") is True, failures)
          check("no failures", not failures, failures)
          check("stratified samples >= 8", len(samples) >= 8, len(samples))
          check("text measurement <= 1pt", max(text_errors or [99]) <= 1.0, text_errors)
          check("complex measurement <= 4pt", max(complex_errors or [99]) <= 4.0, complex_errors)

          a = r.get("asyncMarkdown", {})
          check("async markdown below anchor <= 0.5pt", a.get("belowAnchorDelta", 99) <= 0.5, a)
          s = r.get("streaming", {})
          check("streaming monotonic", s.get("monotonic") is True, s.get("heights"))
          check("streaming shortfall <= 0.5pt", s.get("maxShortfall", 99) <= 0.5, s.get("maxShortfall"))
          check("streaming one move per tick", max(s.get("movesPerTick") or [99]) <= 1, s.get("movesPerTick"))
          b = r.get("bottom", {})
          check("instant bottom shortfall <= 0.5", b.get("instantShortfall", 99) <= 0.5, b.get("instantShortfall"))
          check("animated bottom shortfall <= 0.5", b.get("animatedShortfall", 99) <= 0.5, b.get("animatedShortfall"))
          check("no-op watchdog settles", b.get("phaseAfterNoop") == "idle", b.get("phaseAfterNoop"))
          p = r.get("prepend", {})
          check("prepend anchor <= 0.5pt", p.get("anchorDeltaY", 99) <= 0.5, p.get("anchorDeltaY"))
          check("prepend target queried", p.get("targetContentOffsetCalls", 0) >= 1, p.get("targetContentOffsetCalls"))
          check("prepend double query idempotent", p.get("doubleQuerySame") is True, p)
          check("prepend cancellation releases", p.get("cancelledUnchanged") is True, p)
          check("history settled", p.get("settled") is True, p)

          failed = [c for c in checks if not c[1]]
          for name, ok, detail in checks:
              print(("PASS " if ok else "FAIL ") + name + ("" if ok else f" | {detail}"))
          if failed:
              print("::error::timeline gate failed: " + "; ".join(c[0] for c in failed))
              sys.exit(1)
          PY

      - name: Run the M3 TextKit gate
        if: always()
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl terminate "$UDID" com.agentsanywhere.app || true
          xcrun simctl launch "$UDID" com.agentsanywhere.app aa-textkit-m3
          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.agentsanywhere.app data)
          RESULT="$CONTAINER/Documents/textkit-m3.json"
          for _ in $(seq 1 120); do
            if [ -f "$RESULT" ]; then break; fi
            sleep 1
          done
          if [ ! -f "$RESULT" ]; then
            echo "::error::textkit M3 gate produced no result file"
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/textkit-m3-failure.png" || true
            exit 1
          fi
          cp "$RESULT" "$RUNNER_TEMP/textkit-m3.json"
          cat "$RUNNER_TEMP/textkit-m3.json"

      - name: Assert the M3 TextKit results
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, sys
          path = os.path.join(os.environ["RUNNER_TEMP"], "textkit-m3.json")
          if not os.path.exists(path):
              print("::error::textkit M3 result missing")
              sys.exit(1)
          r = json.load(open(path))
          tk = r.get("textKit", {})
          counts = tk.get("blockCounts") or {}
          scroll = tk.get("scroll") or {}
          cell_build = tk.get("cellBuild") or {}
          checks = [
              ("completed", r.get("completed") is True, r.get("failures")),
              ("no failures", not r.get("failures"), r.get("failures")),
              ("first stored == measured",
               abs(tk.get("stored", 0) - tk.get("measured", -1)) <= 0.5, tk),
              ("cell content within 1pt",
               abs(tk.get("cellContent", 0) - tk.get("stored", 0)) <= 1.0, tk),
              ("row not pending", tk.get("pending") is False, tk),
              ("cell materialized", tk.get("cellMaterialized") is True, tk),
              ("no adjacent overlap", (tk.get("overlaps") or 0) == 0, tk),
              ("no estimate stored", abs(tk.get("stored", 0) - tk.get("estimate", -1)) > 0.5, tk),
              ("footer included",
               abs(tk.get("footerDelta", 0) - tk.get("footerHeight", -1)) <= 1.5, tk),
              ("parser contract",
               tk.get("plainAccepted") is True and tk.get("unorderedAccepted") is True
               and tk.get("orderedAccepted") is True and tk.get("quoteAccepted") is True
               and tk.get("codeAccepted") is True and tk.get("tableAccepted") is True
               and tk.get("imageRejected") is True, tk),
              ("fixture tree",
               tk.get("topLevelBlocks") == 8 and counts.get("text") == 12
               and counts.get("list") == 4 and counts.get("quote") == 1
               and counts.get("code") == 1 and counts.get("table") == 1, tk),
              ("scroll covered",
               scroll.get("steps") == 24 and scroll.get("reachedBottom") is True,
               scroll),
              ("cell build sampled", (cell_build.get("count") or 0) > 0,
               cell_build),
          ]
          failed = [c for c in checks if not c[1]]
          for name, ok, detail in checks:
              print(("PASS " if ok else "FAIL ") + name + ("" if ok else f" | {detail}"))
          if failed:
              print("::error::textkit M3 gate failed: " + "; ".join(c[0] for c in failed))
              sys.exit(1)
          PY

      - name: Capture the visual parity pair
        if: always()
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl terminate "$UDID" com.agentsanywhere.app || true
          xcrun simctl launch "$UDID" com.agentsanywhere.app aa-textkit-parity
          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.agentsanywhere.app data)
          RESULT="$CONTAINER/Documents/textkit-parity.json"
          for _ in $(seq 1 90); do
            if [ -f "$RESULT" ]; then break; fi
            sleep 1
          done
          if [ ! -f "$RESULT" ]; then
            echo "::error::visual parity capture produced no result file"
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/parity-failure.png" || true
            exit 1
          fi
          cp "$RESULT" "$RUNNER_TEMP/textkit-parity.json"
          cp "$CONTAINER/Documents/parity-legacy.png" "$RUNNER_TEMP/parity-legacy.png"
          cp "$CONTAINER/Documents/parity-textkit.png" "$RUNNER_TEMP/parity-textkit.png"
          cat "$RUNNER_TEMP/textkit-parity.json"

      - name: Run the M4 baseline probe
        if: always()
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl terminate "$UDID" com.agentsanywhere.app || true
          xcrun simctl launch "$UDID" com.agentsanywhere.app aa-textkit-m4-baseline
          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.agentsanywhere.app data)
          RESULT="$CONTAINER/Documents/textkit-m4-baseline.json"
          for _ in $(seq 1 120); do
            if [ -f "$RESULT" ]; then break; fi
            sleep 1
          done
          if [ ! -f "$RESULT" ]; then
            echo "::error::M4 baseline probe produced no result file"
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/m4-baseline-failure.png" || true
            exit 1
          fi
          cp "$RESULT" "$RUNNER_TEMP/textkit-m4-baseline.json"
          cat "$RUNNER_TEMP/textkit-m4-baseline.json"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timeline-autorun
          path: |
            ${{ runner.temp }}/timeline-autorun.json
            ${{ runner.temp }}/textkit-m3.json
            ${{ runner.temp }}/textkit-parity.json
            ${{ runner.temp }}/textkit-m4-baseline.json
            ${{ runner.temp }}/m4-baseline-failure.png
            ${{ runner.temp }}/parity-legacy.png
            ${{ runner.temp }}/parity-textkit.png
            ${{ runner.temp }}/parity-failure.png
            ${{ runner.temp }}/timeline-failure.png
            ${{ runner.temp }}/timeline-final.png
            ${{ runner.temp }}/textkit-m3-failure.png
            ${{ runner.temp }}/sim-build.log
          if-no-files-found: ignore

      - name: Shut down simulator
        if: always()
        run: xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" || true

  textkit-spike:
    # C5/M1: measure the assistant body with CDMarkdownKit's TextKit 2 stack and
    # a minimal self-built TextKit 2 stack against the current Textual renderer,
    # all at the same column width. The run reports numbers; it fails only when
    # the app produced no result file (infrastructure), not when a parity check
    # inside the report fails.
    needs: test
    if: inputs.textkit_spike == true
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pin Xcode
        run: |
          sudo xcode-select -s /Applications/${{ github.event.inputs.xcode || 'Xcode_26.5.app' }}
          xcodebuild -version

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-spike-${{ runner.os }}-${{ hashFiles('ios/**/Package.resolved', 'ios/**/Package.swift', 'ios/**/*.pbxproj') }}

      - name: Pick an iPhone simulator
        id: sim
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          best = None
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              version = (int(match.group(1)), int(match.group(2))) if match else (0, 0)
              for device in devices:
                  if not device.get("name", "").startswith("iPhone"):
                      continue
                  if not device.get("isAvailable", False):
                      continue
                  key = (version, device["name"])
                  if best is None or key > best[0]:
                      best = (key, device)
          if best is None:
              raise SystemExit("no available iPhone simulator runtime")
          print(f"udid={best[1]['udid']}")
          print(f"name={best[1]['name']}")
          print(f"runtime={best[0][0]}.{best[0][1]}")
          PY

      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: Build for simulator
        run: |
          set -o pipefail
          cd "ios/Agents Anywhere"
          xcodebuild build \
            -project "Agents Anywhere.xcodeproj" \
            -scheme "Agents Anywhere" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_DEBUG_DYLIB=NO \
            -derivedDataPath build/DDSim \
            2>&1 | tee "$RUNNER_TEMP/spike-build.log" | tail -60

      - name: Install and run the spike
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP="ios/Agents Anywhere/build/DDSim/Build/Products/Debug-iphonesimulator/Agents Anywhere.app"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl terminate "$UDID" com.agentsanywhere.app || true
          xcrun simctl launch "$UDID" com.agentsanywhere.app aa-textkit-spike
          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.agentsanywhere.app data)
          RESULT="$CONTAINER/Documents/textkit-spike.json"
          for _ in $(seq 1 300); do
            if [ -f "$RESULT" ]; then break; fi
            sleep 1
          done
          if [ ! -f "$RESULT" ]; then
            echo "::error::textkit spike produced no result file"
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/textkit-spike-failure.png" || true
            exit 1
          fi
          cp "$RESULT" "$RUNNER_TEMP/textkit-spike.json"
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/textkit-spike-final.png" || true

      - name: Print the height table
        run: |
          python3 - <<'PY'
          import json, os, sys
          path = os.path.join(os.environ["RUNNER_TEMP"], "textkit-spike.json")
          r = json.load(open(path))
          if r.get("completed") is not True:
              print("::error::textkit spike did not complete")
              sys.exit(1)
          print(f"width={r.get('width')} typography={r.get('typography')}")
          print(f"{'fixture':<14}{'product':>10}{'cd':>10}{'tk2':>10}{'cd-tk2':>10}{'prod-tk2':>10}")
          for f in r.get("fixtures", []):
              product = f.get("product", {}).get("height", 0)
              cd = f.get("cdmarkdown", {}).get("height", 0)
              tk2 = f.get("tk2SameAttributed", 0)
              delta = f.get("productVsTk2Plain", f.get("productVsCD"))
              print(f"{f.get('name',''):<14}{product:>10.2f}{cd:>10.2f}{tk2:>10.2f}"
                    f"{f.get('cdVsTk2', 0):>10.2f}{(delta if delta is not None else float('nan')):>10.2f}")
          print("checks:", json.dumps(r.get("checks", {}), sort_keys=True))
          print("streaming:", json.dumps(r.get("streaming", {}), sort_keys=True))
          print("failures:", json.dumps(r.get("failures", []), ensure_ascii=False))
          print("passed:", r.get("passed"))
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: textkit-spike
          path: |
            ${{ runner.temp }}/textkit-spike.json
            ${{ runner.temp }}/textkit-spike-failure.png
            ${{ runner.temp }}/textkit-spike-final.png
            ${{ runner.temp }}/spike-build.log
          if-no-files-found: ignore

      - name: Shut down simulator
        if: always()
        run: xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" || true

  build:
    # The package is only released once the unit tests pass: a red test suite
    # must never produce an installable IPA.
    needs: test
    # Verification-only dispatches (feature branches) run the test job alone.
    # A branch dispatch may opt into a build with `build: true`; that publishes
    # to its own `ipa-<branch>` tag and never touches `ipa-dev`, so a
    # half-finished branch can never clobber the dev line's installable IPA.
    if: github.ref == 'refs/heads/dev' || inputs.build
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: List available Xcodes
        run: ls /Applications | grep -i "^Xcode" || true

      # Toolchain and deployment target are decoupled: a newer SDK builds an app
      # whose deployment target stays 26.2 (patched on this branch, mirrors
      # ios-ci). The newer compiler is required — SE-0442 relaxed the access
      # level of synthesized memberwise inits for structs whose private stored
      # properties all have defaults, and TimelineHistoryPull(edge:) depends
      # on that (Xcode 26.2 reports "argument passed to call that takes no
      # arguments").
      - name: Pin Xcode
        run: |
          sudo xcode-select -s /Applications/${{ github.event.inputs.xcode || 'Xcode_26.5.app' }}
          xcodebuild -version

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('ios/**/Package.resolved', 'ios/**/Package.swift') }}

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ios/Agents Anywhere/build/DerivedData
          key: dd-${{ runner.os }}-${{ hashFiles('ios/**') }}
          restore-keys: dd-${{ runner.os }}-

      - name: Build (unsigned)
        run: |
          set -o pipefail
          cd "ios/Agents Anywhere"
          xcodebuild build \
            -project "Agents Anywhere.xcodeproj" \
            -scheme "Agents Anywhere" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_DEBUG_DYLIB=NO \
            SWIFT_NUM_THREADS=2 \
            SWIFT_COMPILATION_MODE=incremental \
            'OTHER_SWIFT_FLAGS=-Xfrontend -disable-batch-mode' \
            -derivedDataPath build/DerivedData \
            2>&1 | tee "$RUNNER_TEMP/build.log" | tail -40

      - name: Print compiler errors on failure
        if: failure()
        run: |
          grep -E "error:|fatal error|The following build commands failed" \
            "$RUNNER_TEMP/build.log" 2>/dev/null | sort -u | head -40 || true

      - name: Package ipa
        run: |
          cd "ios/Agents Anywhere"
          PRODUCTS=build/DerivedData/Build/Products/Release-iphoneos
          ls "$PRODUCTS"
          mkdir -p /tmp/out/Payload
          cp -r "$PRODUCTS"/*.app /tmp/out/Payload/
          APP=/tmp/out/Payload/*.app
          # Prove the deployment-target patch landed in the shipped binary.
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" $APP/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" $APP/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" $APP/Info.plist
          (cd /tmp/out && zip -qr "$GITHUB_WORKSPACE/agents-anywhere.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE/agents-anywhere.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref == 'refs/heads/dev' && 'agents-anywhere-dev-ipa' || 'agents-anywhere-branch-ipa' }}
          path: agents-anywhere.ipa
          if-no-files-found: error

      - name: Release unsigned .ipa
        env:
          GH_TOKEN: ${{ github.token }}
          SHA_SHORT: ${{ github.sha }}
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/dev" ]; then
            TAG="ipa-dev"; SLUG="dev"
            TITLE="Agents Anywhere unsigned builds — dev"
            NOTES="Built from the dev branch. Unsigned — re-sign on-device with KSign."
          else
            # A branch name may contain '/', which cannot appear in a file name.
            SLUG=$(printf '%s' "${GITHUB_REF_NAME}" | tr '/' '-')
            TAG="ipa-${SLUG}"
            TITLE="Agents Anywhere unsigned builds — ${GITHUB_REF_NAME}"
            NOTES="Built from the ${GITHUB_REF_NAME} branch. Unsigned — re-sign on-device with KSign."
          fi
          NAME="AgentsAnywhere-${SLUG}-${SHA_SHORT:0:7}.ipa"
          cp agents-anywhere.ipa "$NAME"
          gh release create "$TAG" --title "$TITLE" --notes "$NOTES" || true
          gh release upload "$TAG" "$NAME" --clobber
