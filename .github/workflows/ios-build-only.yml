name: iOS Build Only

# Temporary verification workflow for the composer visual branch: the main
# pipeline's build job sits behind `test`, and macOS runners are intermittently
# unavailable long enough for the 15-minute queue timeout to cancel it. This
# workflow runs the same unsigned build with no dependency, so a single
# dispatch can claim a runner as soon as one appears.
# Delete before merging the feature branch.

run-name: "iOS Build Only · ${{ inputs.title || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      title:
        description: "What this build changes (shown in the run title)"
        required: false
        default: ""
      xcode:
        description: "Xcode app name on the runner (e.g. Xcode_26.3.app)"
        default: "Xcode_26.3.app"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: List available Xcodes
        run: ls /Applications | grep -i "^Xcode" || true

      - name: Pin Xcode
        run: |
          sudo xcode-select -s /Applications/${{ inputs.xcode }}
          xcodebuild -version

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('ios/**/Package.resolved', 'ios/**/Package.swift') }}

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ios/Agents Anywhere/build/DerivedData
          key: dd-${{ runner.os }}-${{ hashFiles('ios/**') }}
          restore-keys: dd-${{ runner.os }}-

      - name: Build (unsigned)
        run: |
          set -o pipefail
          cd "ios/Agents Anywhere"
          xcodebuild build \
            -project "Agents Anywhere.xcodeproj" \
            -scheme "Agents Anywhere" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_DEBUG_DYLIB=NO \
            SWIFT_NUM_THREADS=2 \
            SWIFT_COMPILATION_MODE=incremental \
            "OTHER_SWIFT_FLAGS=-Xfrontend -disable-batch-mode" \
            -derivedDataPath build/DerivedData \
            2>&1 | tee "$RUNNER_TEMP/build.log" | tail -40

      - name: Print compiler errors on failure
        if: failure()
        run: |
          grep -E "error:|fatal error|The following build commands failed" \
            "$RUNNER_TEMP/build.log" 2>/dev/null | sort -u | head -40 || true

      - name: Package ipa
        run: |
          cd "ios/Agents Anywhere"
          PRODUCTS=build/DerivedData/Build/Products/Release-iphoneos
          ls "$PRODUCTS"
          mkdir -p /tmp/out/Payload
          cp -r "$PRODUCTS"/*.app /tmp/out/Payload/
          APP=/tmp/out/Payload/*.app
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" $APP/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" $APP/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" $APP/Info.plist
          (cd /tmp/out && zip -qr "$GITHUB_WORKSPACE/agents-anywhere.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE/agents-anywhere.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agents-anywhere-branch-ipa
          path: agents-anywhere.ipa
          if-no-files-found: error
